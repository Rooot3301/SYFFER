[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "syffer"
version = "0.2.0"
description = "Outil de recon reseau CLI (capture de paquets, scan ARP, infos reseau)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<4"
authors = [{ name = "ROOT3301" }]
keywords = ["network", "recon", "packet", "scan", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
  "scapy>=2.5,<3",
  "psutil>=5.9,<7",
  "requests>=2.32,<3",
  "rich>=13,<14",
  "questionary>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-mock>=3.12,<4",
  "pytest-cov>=5,<7",
]

[project.scripts]
syffer = "syffer.__main__:main"

[project.urls]
Homepage = "https://github.com/Rooot3301/SYFFER"
Repository = "https://github.com/Rooot3301/SYFFER"

[tool.hatch.build.targets.wheel]
packages = ["syffer"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
